name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter --version

      - name: Generate missing android/ scaffold (source zip lacked it)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.example --project-name manager_assistant .
          fi

      - run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_log.txt

      - name: Create Release with APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            "build/app/outputs/flutter-apk/app-release.apk" \
            --title "Manager Assistant APK build #${{ github.run_number }}" \
            --notes "Automated release build from commit ${{ github.sha }}"

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${{ github.run_number }}"
          tail -n 500 build_log.txt > build_log_tail.txt || echo "no log" > build_log_tail.txt
          gh release create "$TAG" \
            "build_log_tail.txt" \
            --title "Build FAILED log #${{ github.run_number }}" \
            --notes "Automated failure log from commit ${{ github.sha }}"
