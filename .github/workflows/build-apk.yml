name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: >-
          release = customer APK signed with the PRIVATE release key (fails if the signing secrets are missing;
          never falls back to debug signing). debug = explicitly debug-signed test APK, NOT for customers.
          release-selftest = proves the Gradle signing wiring with a throwaway key generated in this run
          (NOT for customers; does not touch the real key).
        type: choice
        default: release
        options: [release, debug, release-selftest]
      publish_release:
        description: "Also publish a GitHub Release (release builds only). Pushes to main always publish."
        type: boolean
        default: false
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned (Session 4): build #81 (green) ran Flutter 3.47.7 / Dart 3.13.5. Unpinned 'stable'
          # silently changed plugin resolution between #75 and #76 and broke the app (black screen).
          # Bump deliberately, with a device test.
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Toolchain fingerprint (recorded in the release notes)
        run: |
          flutter --version 2>&1 | tee toolchain.txt
          echo "" >> toolchain.txt
          echo "pubspec.lock shared_preferences_android:" >> toolchain.txt
          grep -A6 '^  shared_preferences_android:' pubspec.lock >> toolchain.txt || true

      - name: Generate missing android/ scaffold (source zip lacked it)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.moamen --project-name manager_assistant .
          fi
          # `flutter create .` only writes files that don't already exist, and this repo
          # has never committed test/widget_test.dart — so every run since android/ stopped
          # being committed has silently regenerated Flutter's default boilerplate test here,
          # which references a non-existent `MyApp` class (our root widget is `ManagerApp` in
          # lib/main.dart). It was invisible because CI never ran `flutter analyze`/`flutter
          # test` until this build. Our own suite (test/*_test.dart) already covers the app;
          # remove the generated placeholder so it can't fail analysis or tests.
          rm -f test/widget_test.dart

      - name: Inject required Android permissions (mic + notifications)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            for perm in \
              'android.permission.RECORD_AUDIO' \
              'android.permission.POST_NOTIFICATIONS' \
              'android.permission.INTERNET' \
              'android.permission.RECEIVE_BOOT_COMPLETED' \
              'android.permission.SCHEDULE_EXACT_ALARM'; do
              if ! grep -q "$perm" "$MANIFEST"; then
                sed -i "/<manifest /a\\    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
              fi
            done
            echo "---- AndroidManifest.xml after injection ----"
            cat "$MANIFEST"
          fi

      - name: Register flutter_local_notifications boot receiver (reminders survive reboot)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "ScheduledNotificationBootReceiver" "$MANIFEST"; then
            # flutter_local_notifications ships these two receiver classes inside its own
            # Android library (no custom native code needed). ScheduledNotificationBootReceiver
            # listens for BOOT_COMPLETED and re-arms the plugin's own natively-persisted
            # pending notification requests directly — no Dart/Flutter execution required at
            # boot time, so this does not introduce a second scheduling architecture.
            # Must be a child of <application>, not <manifest>, hence anchored on the fixed
            # literal line that closes <application ...> in Flutter's current template
            # (verified against flutter/flutter packages/flutter_tools templates source).
            cat > /tmp/boot_receiver_block.xml << 'RECEIVER_EOF'
          <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
          <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
              <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED" />
                  <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                  <action android:name="android.intent.action.QUICKBOOT_POWERON" />
              </intent-filter>
          </receiver>
          RECEIVER_EOF
            sed -i '/android:icon="@mipmap\/ic_launcher">/r /tmp/boot_receiver_block.xml' "$MANIFEST"
          fi
          echo "---- AndroidManifest.xml after boot-receiver injection ----"
          cat "$MANIFEST"

      - name: Add ProGuard rules for flutter_local_notifications and Gson
        run: |
          cat > android/app/proguard-rules.pro << 'PROGUARD_EOF'
          # Keep flutter_local_notifications classes intact.
          # The plugin uses Gson for serializing scheduled notification payloads.
          # Without these rules, R8 strips Gson generic type metadata (TypeToken, etc.),
          # causing "Missing type parameter" / ClassCastException at runtime when
          # flutter_local_notifications tries to deserialize persisted notifications.
          -keep class com.dexterous.flutterlocalnotifications.** { *; }
          -keep class com.google.gson.** { *; }
          -keepattributes Signature
          -keepattributes *Annotation*
          # Also needed for the underlying AlarmManager/notification serialization.
          -dontwarn com.google.gson.**
          PROGUARD_EOF
          echo "---- proguard-rules.pro created ----"
          cat android/app/proguard-rules.pro

      - name: Enable core library desugaring + R8 minification with ProGuard rules
        run: |
          # Flutter generates build.gradle (Groovy) by default when the android/ folder
          # is fresh from flutter create. We append to it.
          if [ -f "android/app/build.gradle.kts" ]; then
            cat >> android/app/build.gradle.kts << 'GRADLE_EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          GRADLE_EOF
          elif [ -f "android/app/build.gradle" ]; then
            cat >> android/app/build.gradle << 'GRADLE_EOF'

          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          GRADLE_EOF
          fi
          echo "---- build.gradle after update ----"
          cat android/app/build.gradle || cat android/app/build.gradle.kts

      - name: Verify production application id in the generated Android project
        run: |
          # Permanent production identity. Fail here (not after a 10-minute build) if it ever drifts.
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n 1)
          echo "checking $f"
          grep -E 'applicationId|namespace' "$f"
          grep -q 'com.moamen.manager_assistant' "$f" || { echo "::error title=Wrong application id::expected com.moamen.manager_assistant in $f"; exit 1; }
          if grep -q 'com\.example' "$f" android/app/src/main/AndroidManifest.xml; then
            echo "::error title=com.example leftover::remove the com.example fallback"; exit 1
          fi

      - name: Prepare release signing (private key from secrets; NO silent debug fallback)
        if: ${{ inputs.build_type != 'debug' }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          ks="$RUNNER_TEMP/release.jks"
          if [ "$BUILD_TYPE" = "release-selftest" ]; then
            # Throwaway key, only to prove that the Gradle wiring signs with the configured key.
            KS_PASS="selftest-$(openssl rand -hex 8)"; KEY_PASS="$KS_PASS"; KEY_ALIAS="selftest"
            keytool -genkeypair -keystore "$ks" -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 2 -dname "CN=SELFTEST ONLY, O=not-for-customers" >/dev/null 2>&1
            echo "SELFTEST_KEY_SHA256=$(keytool -list -v -keystore "$ks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" 2>/dev/null | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' | sed -n 1p)" >> "$GITHUB_ENV"
          else
            missing=""
            [ -n "$KS_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
            [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
            [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
            [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
            if [ -n "$missing" ]; then
              echo "::error title=Release signing secrets are missing::Not available to this workflow:$missing. Add them as repository secrets of THIS repository (secrets stored only in another repository are not visible here). The build stops instead of falling back to debug signing."
              exit 1
            fi
            printf '%s' "$KS_B64" | base64 -d > "$ks" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64"; exit 1; }
            keytool -list -keystore "$ks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1 \
              || { echo "::error title=Keystore check failed::alias/password do not open the keystore (values are never printed)"; exit 1; }
          fi
          umask 077
          {
            echo "storeFile=$ks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts << 'SIGN_EOF'

          // Plain Kotlin stdlib on purpose: inside a Gradle .kts script the name `java` resolves to the
          // Java plugin extension, so `java.util.Properties` does not compile there.
          val keystoreProps: Map<String, String> = rootProject.file("key.properties")
              .takeIf { it.exists() }
              ?.readLines()
              ?.filter { it.contains("=") }
              ?.associate { it.substringBefore("=") to it.substringAfter("=") }
              ?: emptyMap()
          android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProps["keyAlias"]
                      keyPassword = keystoreProps["keyPassword"]
                      storeFile = keystoreProps["storeFile"]?.let { file(it) }
                      storePassword = keystoreProps["storePassword"]
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          SIGN_EOF
          else
            cat >> android/app/build.gradle << 'SIGN_EOF'

          def keystoreProps = new Properties()
          def keystoreFile = rootProject.file("key.properties")
          if (keystoreFile.exists()) { keystoreProps.load(new FileInputStream(keystoreFile)) }
          android {
              signingConfigs {
                  release {
                      keyAlias keystoreProps['keyAlias']
                      keyPassword keystoreProps['keyPassword']
                      storeFile file(keystoreProps['storeFile'])
                      storePassword keystoreProps['storePassword']
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          SIGN_EOF
          fi
          echo "release signing configured (key material not printed)"

      - run: flutter pub get

      - name: Guard — dependency drift (shared_preferences_android must stay 2.4.28)
        run: |
          v=$(awk '/^  shared_preferences_android:/{f=1} f && /version:/{print $2; exit}' pubspec.lock | tr -d '"')
          echo "resolved shared_preferences_android=$v"
          test "$v" = "2.4.28"

      - name: Static analysis (flutter analyze)
        run: |
          set -o pipefail
          # --no-fatal-infos: fail the build on real errors/warnings, not on the
          # pre-existing style-only "info" lints (prefer_const_constructors etc.)
          # that predate this CI check and are out of scope for this change —
          # fixing those is a separate, broader cleanup, not a build-breaking bug.
          flutter analyze --no-fatal-infos 2>&1 | tee build_log.txt

      - name: Run tests (offline suite)
        run: |
          set -o pipefail
          flutter test --exclude-tags live 2>&1 | tee -a build_log.txt

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -o pipefail
          # versionCode must grow between builds so a new APK installs over the previous one.
          if [ "$BUILD_TYPE" = "debug" ]; then MODE=--debug; else MODE=--release; fi
          flutter build apk $MODE --build-number=${{ github.run_number }} 2>&1 | tee -a build_log.txt

      - name: Verify the REAL APK (applicationId, version, signing certificate, checksum)
        id: apk
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          EXPECTED_SIGNER: ${{ vars.EXPECTED_SIGNER_SHA256 }}
        run: |
          set -eo pipefail
          apk=$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' | sort | sed -n 1p)
          [ -n "$apk" ] || { echo "::error::No APK produced"; exit 1; }
          bt=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -n 1)
          "$bt/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          badging=$(sed -n 1p "$RUNNER_TEMP/badging.txt")
          # anchored: other attributes on this line (e.g. compileSdkVersionCodename) also contain "name='"
          pkg=$(echo "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          vcode=$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          vname=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          certs=$("$bt/apksigner" verify --verbose --print-certs "$apk")
          signer=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | sed -n 1p)
          subject=$(echo "$certs" | sed -n 's/.*certificate DN: //p' | sed -n 1p)
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "package=$pkg versionName=$vname versionCode=$vcode"
          echo "signer SHA-256=$signer  DN=$subject"
          echo "APK SHA-256=$sha"
          [ "$pkg" = "com.moamen.manager_assistant" ] || { echo "::error title=Wrong applicationId::$pkg"; exit 1; }
          DEBUG_KEY=136966601854d1bd1397841d7d5ef10f1145bd8ac71c49f8ac6812857f136233
          kind=release
          case "$BUILD_TYPE" in
            debug) kind=DEBUG-NOT-FOR-CUSTOMERS ;;
            release-selftest)
              kind=SELFTEST-NOT-FOR-CUSTOMERS
              [ "$signer" = "$SELFTEST_KEY_SHA256" ] || { echo "::error title=Selftest signer mismatch::APK was not signed by the configured key (got $signer, expected $SELFTEST_KEY_SHA256)"; exit 1; }
              ;;
            *)
              if [ "$signer" = "$DEBUG_KEY" ] || echo "$subject" | grep -qi "Android Debug"; then
                echo "::error title=Release APK is debug-signed::refusing to ship"; exit 1
              fi
              if [ -n "$EXPECTED_SIGNER" ] && [ "$signer" != "$EXPECTED_SIGNER" ]; then
                echo "::error title=Signing identity changed::signer $signer != EXPECTED_SIGNER_SHA256"; exit 1
              fi
              ;;
          esac
          out="manager-assistant-${vname}-b${vcode}-${kind}.apk"
          cp "$apk" "build/$out"
          {
            echo "apk=build/$out"; echo "kind=$kind"; echo "pkg=$pkg"; echo "vname=$vname"; echo "vcode=$vcode"
            echo "signer=$signer"; echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### APK verification ($kind)"
            echo "- applicationId: \`$pkg\`"
            echo "- version: \`$vname\` (code \`$vcode\`)"
            echo "- signing certificate SHA-256: \`$signer\`"
            echo "- signing certificate DN: \`$subject\`"
            echo "- APK SHA-256: \`$sha\`"
            if [ "$kind" = release ] && [ -z "$EXPECTED_SIGNER" ]; then
              echo "- ℹ️ first release: store the signer fingerprint above in the repository variable EXPECTED_SIGNER_SHA256 so any later change in signing identity fails the build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material from the runner
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.apk.outputs.kind }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 30

      - name: Create GitHub Release with the signed APK
        if: ${{ success() && steps.apk.outputs.kind == 'release' && (github.event_name == 'push' || inputs.publish_release == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.apk }}" \
            --target "${{ github.sha }}" \
            --title "Manager Assistant build #${{ github.run_number }} (${{ steps.apk.outputs.vname }})" \
            --notes "Release-signed APK from commit ${{ github.sha }} (branch ${{ github.ref_name }}).

          - applicationId: ${{ steps.apk.outputs.pkg }}
          - version: ${{ steps.apk.outputs.vname }} (code ${{ steps.apk.outputs.vcode }})
          - signing certificate SHA-256: ${{ steps.apk.outputs.signer }}
          - APK SHA-256: ${{ steps.apk.outputs.sha }}

          Toolchain:
          $(cat toolchain.txt)"

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${{ github.run_number }}"
          tail -n 500 build_log.txt > build_log_tail.txt || echo "no log" > build_log_tail.txt
          gh release create "$TAG" \
            "build_log_tail.txt" \
            --title "Build FAILED log #${{ github.run_number }}" \
            --notes "Automated failure log from commit ${{ github.sha }}"
