name: manager_assistant
description: مساعد الإدارة - AI Chief of Staff للمشروعات الصغيرة
publish_to: 'none'
version: 1.3.1+5
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  speech_to_text: ^7.0.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
# Pinned on purpose (Session 4): shared_preferences_android 2.5.0 switched to
# "Pigeon JNI" and appeared between CI run #75 and #76 even though pubspec.lock
# says 2.4.28. APK 76 (and 77, built from Build-75 source) showed a black screen.
# Do not unpin without a real-device test.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
